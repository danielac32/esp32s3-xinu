/* Configuration - (device configuration specifications)  */
/* Unspecified switches default to ioerr                  */
/*  -i    init          -o    open      -c    close       */
/*  -r    read          -g    getc      -p    putc        */
/*  -w    write         -s    seek      -n    control     */
/*  -intr interrupt     -csr  csr       -irq  irq         */
/* "type" declarations for both real- and pseudo- devices */
/* null device */
null:
    on NOTHING  -i ionull       -o ionull        -c ionull
                -r ionull       -g ionull        -p ionull
                -w ionull
/* physical uart device */
uart:
	on HARDWARE -i uartInit     -o ionull        -c ionull
	            -r uartRead     -g uartGetc      -p uartPutc
	            -w uartWrite    -n uartControl
                -intr uartInterrupt
/* tty pseudo-devices */
tty:
	on SOFTWARE -i ttyInit      -o ttyOpen       -c ttyClose
	            -r ttyRead      -g ttyGetc       -p ttyPutc
	            -w ttyWrite     -n ttyControl
/* memory-backed TTY used to capture shell output for the web terminal */
memtty:
	on SOFTWARE -i memttyInit    -o memttyOpen    -c memttyClose
	            -r memttyRead    -g memttyGetc    -p memttyPutc
	            -w memttyWrite   -n memttyControl
w5500:
	on HARDWARE -i w5500Init    -o w5500Open    -c w5500Close
	            -r w5500Read    -g w5500Getc    -p w5500Putc
	            -w w5500Write   -n w5500Control
                -intr w5500Interrupt
/* SD card */
sd:
	on HARDWARE -i sdInit       -o sdOpen       -c sdClose
	            -r sdRead       -g sdGetc       -p sdPutc
	            -w sdWrite      -n sdControl
/* TFT display */
tft:
	on SOFTWARE -i tftInit      -o tftOpen      -c tftClose
	            -r tftRead      -g tftGetc      -p tftPutc
	            -w tftWrite     -n tftControl
/* button */
button:
	on HARDWARE -i buttonInit   -o buttonOpen   -c buttonClose
	            -r buttonRead   -g buttonGetc   -p buttonPutc
	            -w buttonWrite  -n buttonControl
                -intr buttonInterrupt
raw:
	on SOFTWARE -i rawInit      -o rawOpen       -c rawClose
	            -r rawRead      -w rawWrite      -n rawControl

udp:
	on NET      -i udpInit      -o udpOpen       -c udpClose
	            -r udpRead      -w udpWrite      -n udpControl

tcp:
	on SOFTWARE -i tcpInit      -o tcpOpen       -c tcpClose
	            -r tcpRead      -w tcpWrite      -n tcpControl
	            -g tcpGetc      -p tcpPutc

telnet:
	on TCP      -i telnetInit   -o telnetOpen    -c telnetClose
	            -r telnetRead   -g telnetGetc    -w telnetWrite
	            -p telnetPutc   -n telnetControl

%%
RAW0      is raw      on SOFTWARE
RAW1      is raw      on SOFTWARE
UDP0      is udp      on NET
UDP1      is udp      on NET
TCP0      is tcp      on SOFTWARE
TCP1      is tcp      on SOFTWARE
TCP2      is tcp      on SOFTWARE
TCP3      is tcp      on SOFTWARE
TCP4      is tcp      on SOFTWARE
TCP5      is tcp      on SOFTWARE
TCP6      is tcp      on SOFTWARE
TCP7      is tcp      on SOFTWARE
TCP8      is tcp      on SOFTWARE
TCP9      is tcp      on SOFTWARE
TELNET0   is telnet   on TCP
TELNET1   is telnet   on TCP
TELNET2   is telnet   on TCP
TELNET3   is telnet   on TCP
SERIAL0   is uart     on HARDWARE csr 0x60000000 irq 23
DEVNULL   is null     on NOTHING
/* TTY for SERIAL0  */
CONSOLE   is tty      on SOFTWARE
/* SD card */
/* TFT display */
/* Button */
/* Raw sockets */
/* Telnet device, used by the telnet daemon */
SD0       is sd      on HARDWARE
TFT0      is tft     on SOFTWARE
BTN0      is button  on HARDWARE
ETH0      is w5500  on HARDWARE
/* Memory TTY for the web terminal (added last to keep existing indices). */
MEMTTY0   is memtty  on SOFTWARE
/* CPU interrupt line (level 3) used by the Xtensa CCOMPARE1 core timer. */
%%
#define IRQ_TIMER     15
/* Configuration and Size Constants */
#define LITTLE_ENDIAN 0x1234
#define BIG_ENDIAN    0x4321
#define BYTE_ORDER    LITTLE_ENDIAN
#define NTHREAD   50            /* number of user threads           */
#define NSEM      128           /* number of semaphores             */
#define NMON      16            /* number of monitors               */
#define NMAILBOX  10            /* number of mailboxes              */
#define RTCLOCK   TRUE          /* timer support                    */
#define NPOOL     8             /* number of buffer pools available */
#define POOL_MAX_BUFSIZE 2048   /* max size of a buffer in a pool  */
#define POOL_MIN_BUFSIZE 8      /* min size of a buffer in a pool  */
#define POOL_MAX_NBUFS   8192   /* max number of buffers in a pool  */
#define NUART     1
/* Networking.  NETHER is the number of network interfaces and it also
 * controls whether the network stack in network/ is built.  The chip's
 * type is named w5500 rather than ether, so the count is written here by
 * hand instead of being derived from the device table. */
#define NETHER    1
#define NNETIF    1
#define NUDP      2
#define NTCP      10
#define NRAW      2
#define NTELNET   4
#define WITH_DHCPC              /* DHCP client for netup            */
#define UART_FIFO_LEN   16
